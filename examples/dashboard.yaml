# Folding@home dashboard: the integration's own cards do everything
# (one column per computer, controls, CPU, GPUs, solar, impact and projects).
title: Folding@home
views:
  - title: Folding
    path: folding
    type: panel
    cards:
      - type: custom:foldingathome-card
        title: Folding@home
        projects_view: impact   # or "details" for the project summaries
        research_hours: 24
  # Just the impact statistics, e.g. for a phone view
  - title: Impact
    path: folding-impact
    cards:
      - type: custom:foldingathome-research-card
        hours: 12
